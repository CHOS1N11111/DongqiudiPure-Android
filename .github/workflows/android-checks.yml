name: Android checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android checks
        # 不加 :app: 前缀 —— 现在是多模块工程，:app:lintDebug 只会检查 app
        # 模块，八个 feature 与三个 core 模块的 lint 和测试都不会跑。
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
